"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
command = "pnpm install --frozen-lockfile && pnpm docs:build"
publish = "website/dist"
ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$COMMIT_REF" = "$CACHED_COMMIT_REF" ]; then exit 1; else git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- website/ netlify.toml || exit 1; fi'

[build.environment]
NODE_VERSION = "26.13.1"
PNPM_VERSION = "12.18.0"

[[headers]]
for = "/demo/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
