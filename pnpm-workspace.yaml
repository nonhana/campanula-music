minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  esbuild: true
  simple-git-hooks: false

catalogs:
  build:
    '@sveltejs/adapter-node': ^6.0.2
    '@sveltejs/adapter-vercel': ^7.0.3
    '@sveltejs/kit': ^3.2.0
    '@sveltejs/vite-plugin-svelte': ^7.3.1
    svelte: ^5.57.3
    vite: ^8.3.8

  dev:
    '@clack/prompts': 1.8.1
    execa: 10.2.1
    p-wait-for: 7.0.0
    pidtree: 1.0.0

  git:
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0

  lint:
    '@antfu/eslint-config': ^10.0.0
    '@unocss/eslint-plugin': ^66.13.0
    eslint: ^10.14.0
    eslint-plugin-svelte: ^3.24.1
    knip: ^6.45.1
    oxfmt: ^0.78.0

  music:
    browser-id3-writer: ^6.4.0
    hana-music-api: 8.0.0
    music-metadata: ^12.5.0
    qrcode: ^1.5.4

  test:
    '@axe-core/playwright': 4.14.0
    '@playwright/test': 1.65.1
    '@sinonjs/fake-timers': ^15.4.0
    '@vitest/coverage-v8': 5.1.0
    '@vitest/istanbul-lib-coverage': 2.1.0
    ast-v8-to-istanbul: 1.0.7
    fake-indexeddb: ^6.2.8
    playwright-core: 1.65.1
    tough-cookie: ^6.1.0
    vitest: ^5.1.0
    ws: 8.23.0

  typescript:
    '@types/node': ^26.6.6
    '@types/qrcode': ^1.5.6
    '@types/ws': 8.18.2
    '@typescript/native': npm:typescript@^7.0.2
    svelte-check: ^4.7.8
    tsx: ^4.23.15
    typescript: 6.0.3

  ui:
    '@fontsource-variable/noto-sans': ^5.3.0
    '@fontsource-variable/noto-sans-jp': ^5.3.1
    '@fontsource-variable/noto-sans-sc': ^5.3.1
    '@fontsource-variable/noto-sans-tc': ^5.3.1
    '@lucide/svelte': ^1.72.0
    '@unocss/preset-rem-to-px': ^66.13.0
    '@unocss/reset': ^66.13.0
    unocss: ^66.13.0

  website:
    '@astrojs/compiler-rs': 0.5.3
    '@astrojs/markdown-remark': 7.3.9
    '@astrojs/markdown-satteri': 0.4.10
    '@astrojs/starlight': 0.43.1
    '@astrojs/svelte': 9.1.6
    astro: 7.4.12
    astro-eslint-parser: 3.2.0
    eslint-plugin-astro: 3.2.1
