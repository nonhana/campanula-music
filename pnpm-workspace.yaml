  '@eslint/config-helpers': ^0.7.0
  '@fontsource-variable/noto-sans': ^5.3.0
  '@fontsource-variable/noto-sans-jp': ^5.3.1
  '@fontsource-variable/noto-sans-sc': ^5.3.1
  '@fontsource-variable/noto-sans-tc': ^5.3.1
  '@lucide/svelte': ^1.58.0
  '@sinonjs/fake-timers': ^15.4.0
  '@sveltejs/adapter-node': ^6.0.0
  '@sveltejs/adapter-vercel': ^7.0.1
  '@sveltejs/kit': ^3.1.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@types/node': ^26.6.5
  '@typescript-eslint/types': ^8.71.2
  '@typescript/native': npm:typescript@^7.0.2
  '@unocss/eslint-plugin': ^66.11.0
  '@unocss/preset-rem-to-px': ^66.11.0
  '@unocss/reset': ^66.11.0
  eslint: ^10.12.0
  eslint-plugin-svelte: ^3.23.1
  fake-indexeddb: ^6.2.5
  globals: ^17.13.0
  hana-music-api: ^2.11.0
  lint-staged: ^17.6.0
  simple-git-hooks: ^2.14.0
  svelte: ^5.57.2
