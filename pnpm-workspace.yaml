minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  esbuild: true
  simple-git-hooks: false

catalogs:
  build:
    '@sveltejs/adapter-node': ^6.0.1
    '@sveltejs/adapter-vercel': ^7.0.2
    '@sveltejs/kit': ^3.1.1
    '@sveltejs/vite-plugin-svelte': ^7.3.1
    svelte: ^5.57.3
    vite: ^8.3.6

  git:
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0

  lint:
    '@antfu/eslint-config': ^10.0.0
    '@unocss/eslint-plugin': ^66.12.0
    eslint: ^10.14.0
    eslint-plugin-svelte: ^3.24.0
    knip: ^6.44.1

  music:
    browser-id3-writer: ^6.4.0
    hana-music-api: ^3.2.0
    music-metadata: ^12.3.5
    tough-cookie: ^6.0.2

  test:
    '@sinonjs/fake-timers': ^15.4.0
    fake-indexeddb: ^6.2.7
    vitest: ^5.1.0

  typescript:
    '@types/node': ^26.6.6
    '@typescript/native': npm:typescript@^7.0.2
    svelte-check: ^4.7.8
    tsx: ^4.23.15
    typescript: 6.0.3

  ui:
    '@fontsource-variable/noto-sans': ^5.3.0
    '@fontsource-variable/noto-sans-jp': ^5.3.1
    '@fontsource-variable/noto-sans-sc': ^5.3.1
    '@fontsource-variable/noto-sans-tc': ^5.3.1
    '@lucide/svelte': ^1.70.0
    '@unocss/preset-rem-to-px': ^66.12.0
    '@unocss/reset': ^66.12.0
    unocss: ^66.12.0
