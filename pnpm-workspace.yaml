minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  esbuild: true
  # 钩子由 package.json 的 prepare 安装，不需要它自己的安装后脚本
  simple-git-hooks: false

catalog:
