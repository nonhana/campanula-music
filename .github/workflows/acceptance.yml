name: Full acceptance

on:
  workflow_call:
    outputs:
      candidate_id:
        description: Verified candidate artifact from this run
        value: ${{ jobs.delivery.outputs.candidate_id }}
      candidate_sha256:
        description: SHA-256 of the verified candidate archive
        value: ${{ jobs.delivery.outputs.candidate_sha256 }}
  workflow_dispatch:
  schedule:
    - cron: '43 18 * * *'
  push:
    branches: ['acceptance/**']

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &pnpm
        uses: pnpm/action-setup@v6
      - &node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml') }}
      - name: 静态检查与 SDK 合同清单
        run: sh tests/tools/offline.sh sh -ec 'pnpm test:ci static && pnpm sdk:report'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-${{ github.sha }}
          path: |
            .reports/sdk/
            .reports/offline/
            .reports/plans/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: 全量 Vitest、SSR 覆盖率与校准
        run: sh tests/tools/offline.sh pnpm test:ci coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ github.sha }}
          path: |
            .reports/runs/
            .reports/latest-*.json
            .reports/environments/
            .reports/offline/
            .reports/plans/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  browser:
    name: browser-${{ matrix.project }}-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
        suite: [journeys, accessibility]
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm exec playwright install --with-deps chromium
      - name: 运行本视口和目录的全部用例
        run: sh tests/tools/offline.sh pnpm exec tsx tests/tools/browser.mts "${{ matrix.suite }}/" --project "${{ matrix.project }}"
      - name: 提交用例清单与原始对比度数据
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.project }}-${{ matrix.suite }}
          path: |
            .reports/browser/run-*/run.json
            .reports/browser/run-*/tests.json
            .reports/browser/run-*/results/**/contrast-*.json
            !.reports/browser/run-*/results/**/attachments/**
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
      - name: 保存浏览器报告、axe、截图及 trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.project }}-${{ matrix.suite }}
          path: |
            .reports/browser/
            .reports/environments/
            .reports/offline/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  verify:
    if: always()
    needs: [static, coverage, browser]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *pnpm
      - *node
      - name: 核对静态检查、完整覆盖率与四个浏览器作业
        run: node tests/tools/ci-gate.mts verify
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPANULA_CI_NEEDS: ${{ toJSON(needs) }}
      - *install
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-*
          path: .reports/release-browser
      - name: 独立枚举全部用例并核对双视口对比度
        run: sh tests/tools/offline.sh env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" pnpm exec tsx tests/tools/release-browser-gate.mts .reports/release-browser
      - uses: actions/upload-artifact@v7
        with:
          name: release-browser-summary-${{ github.sha }}
          path: |
            .reports/release-browser/summary.json
            tests/baselines/a11y-first-observations.json.gz
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 准备专项 mkcert（不安装 CA）
        run: |
          mkdir -p "$RUNNER_TEMP/campanula-tools"
          curl --fail --location --retry 3 https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64 -o "$RUNNER_TEMP/campanula-tools/mkcert"
          chmod +x "$RUNNER_TEMP/campanula-tools/mkcert"
          echo "$RUNNER_TEMP/campanula-tools" >> "$GITHUB_PATH"
      - name: 双 HTTPS、Cookie 与 WSS/HMR
        run: pnpm test:ci https
      - name: HTTPS 专项报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: https-${{ github.sha }}
          path: |
            .reports/https/
            .reports/environments/
            .reports/plans/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 候选 SDK 合同、行为和页面跨层
        run: sh tests/tools/offline.sh pnpm test:ci sdk
      - name: SDK 候选报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ github.sha }}
          path: |
            .reports/sdk-upgrade-*/
            .reports/plans/
            .reports/offline/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  delivery:
    outputs:
      candidate_id: ${{ steps.candidates.outputs.artifact-id }}
      candidate_sha256: ${{ steps.archive.outputs.sha256 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 同 SHA 双目标、生产 PWA 与版本交接
        run: sh tests/tools/offline.sh pnpm test:ci delivery
      - id: archive
        name: 核验即将归档的候选并记录摘要
        run: |
          set -- .reports/candidates/run-*.tar.gz
          test "$#" -eq 1
          sha256=$(sha256sum "$1" | cut -d' ' -f1)
          pnpm release:check --sha "$GITHUB_SHA" --artifact .reports/candidates --sha256 "$sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: 候选产物与交付报告
        id: candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidates-${{ github.sha }}
          path: |
            .reports/candidates/*.tar.gz
            .reports/candidates/run-*/verification.json
            .reports/delivery/
            .reports/pwa/
            .reports/plans/
            .reports/offline/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  acceptance:
    permissions:
      contents: read
      actions: read
    if: always()
    needs: [verify, https, sdk, delivery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: 拒绝缺失、失败、取消或跳过
        run: node tests/tools/ci-gate.mts
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPANULA_CI_NEEDS: ${{ toJSON(needs) }}
