name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 25 起不再自带 corepack；pnpm/action-setup 按 package.json 的 packageManager 装同一个版本
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 结果缓存：没改过的文件直接跳过；配置或版本变了，ESLint 会自己整份失效
      - uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

      - name: 格式检查
        run: pnpm fmt:check

      - name: 类型检查
        run: pnpm check

      # #68：端点目录、路由路径和 GET/POST 必须一一对应
      - name: 端点目录检查
        run: pnpm check:endpoints

      - name: 测试
        run: pnpm test --coverage

      - name: SSR 覆盖率校准
        run: pnpm test:coverage:calibrate

      - name: 测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ github.sha }}
          path: |
            .reports/runs/
            .reports/latest-*.json
            .reports/environments/
          if-no-files-found: error
          include-hidden-files: true

      - name: 构建（Vercel 适配器）
        run: pnpm build
        env:
          VERCEL: '1'

      - name: 构建（Node 适配器）
        run: pnpm build

      # #58、#61：确认 mock、录制数据、mock 路由和开发设计页没有进生产产物
      - name: 生产构建检查
        run: pnpm check:mock-isolation

  https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 准备专项 mkcert（仅下载二进制，不安装 CA）
        run: |
          mkdir -p "$RUNNER_TEMP/campanula-tools"
          curl --fail --location --retry 3 https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64 -o "$RUNNER_TEMP/campanula-tools/mkcert"
          chmod +x "$RUNNER_TEMP/campanula-tools/mkcert"
          echo "$RUNNER_TEMP/campanula-tools" >> "$GITHUB_PATH"
      - name: 双 HTTPS、Cookie 与 WSS/HMR
        run: pnpm test:environment:https
      - name: HTTPS 专项报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: https-${{ github.sha }}
          path: |
            .reports/https/
            .reports/environments/
          if-no-files-found: error
          include-hidden-files: true
