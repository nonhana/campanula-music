name: CI

on:
  push:
    branches-ignore: ['acceptance/**']
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: select
        run: node tests/tools/daily-plan.mts
        env:
          GH_TOKEN: ${{ github.token }}

  checks:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.name == 'static'
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.chromium
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.name == 'environment'
        run: |
          mkdir -p "$RUNNER_TEMP/campanula-tools"
          curl -fsSL --retry 3 https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64 -o "$RUNNER_TEMP/campanula-tools/mkcert"
          chmod +x "$RUNNER_TEMP/campanula-tools/mkcert"
          echo "$RUNNER_TEMP/campanula-tools" >> "$GITHUB_PATH"
      - name: 运行本分片
        run: sh tests/tools/offline.sh pnpm exec tsx tests/tools/daily-run.mts "$CAMPANULA_CI_LANE"
        env:
          CAMPANULA_CI_LANE: ${{ toJSON(matrix) }}
      - uses: actions/upload-artifact@v7
        with:
          name: receipt-${{ matrix.name }}
          path: .reports/daily/${{ matrix.name }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - if: matrix.name == 'website'
        uses: actions/upload-artifact@v7
        with:
          name: website-candidate
          path: |
            website/dist/
            .reports/daily/website-*/website/
          include-hidden-files: true
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            .reports/
            !.reports/candidates/
            !.reports/daily/*/vercel/output/
          include-hidden-files: true
          if-no-files-found: warn
  ci:
    if: always()
    needs: [plan, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          pattern: receipt-*
          merge-multiple: true
          path: .reports/receipts
      - name: 核对本次计划、提交、分片和对比度状态
        run: node tests/tools/daily-gate.mts .reports/receipts
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LANES_RESULT: ${{ needs.checks.result }}
          DAILY_MATRIX: ${{ needs.plan.outputs.matrix }}
